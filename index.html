<title>Afrika Topographie-Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Seterra-Look: Karte füllt den Bildschirm, Zeit/Prozent-Pille oben rechts, Aufgabe unten. Bewusst ein einziges helles Kartenbild. */
:root{
  --sea:#a9d3e6; --land:#2f8a3c; --border:#5aa864; --coast:#1d6528; --otherland:#d3dfd0; --otherline:#d3dfd0;
  --river:#4aa6d8; --lake:#a9d3e6;
  --dot:#ffffff; --dotline:#1f4d26; --ink:#22332a; --panel:#ffffff; --muted:#6a7a70;
  --ok:#ffffff; --mid:#f5c518; --bad:#e04848; --ask:#ff3fa4;
  --font:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--font);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.map{flex:1;min-height:0;position:relative}
#map{touch-action:none}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:42px;height:42px;border-radius:50%;border:0;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.15);font:inherit;font-size:22px;font-weight:900;color:var(--ink);cursor:pointer}
svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.other{fill:var(--otherland);stroke:none}
.cty{fill:var(--land);stroke:var(--border);stroke-width:1;stroke-linejoin:round}
.coastline{fill:none;stroke:var(--coast);stroke-width:1.4;stroke-linejoin:round;pointer-events:none}
.deco-r{fill:none;stroke:var(--river);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.75;pointer-events:none}
.deco-l{fill:var(--lake);stroke:#7fbfdc;stroke-width:.8;pointer-events:none}

.t .hit{fill:transparent;stroke:transparent}
.t.live{cursor:pointer}
.t.off{pointer-events:none}
.t.line .vis{fill:none;stroke:var(--river);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.t.line .hit{fill:none;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.t.lake .vis{fill:var(--lake);stroke:#6fb3d6;stroke-width:1}
.t.lake .hit{fill:transparent;stroke-width:16;stroke-linejoin:round}
.t.pt .vis{fill:var(--dot);stroke:var(--dotline);stroke-width:2}
.t.pt.live:hover .vis{fill:#fff7c2}
.t.cty .vis{fill:var(--land);stroke:var(--land);stroke-width:1;stroke-linejoin:round}
svg.borders .t.cty .vis{stroke:var(--border)}
.t.cty .hit{fill:transparent}
.t.cty.live:hover .vis{fill:#3fa04d}
.t.off.cty .vis{fill:var(--land)}
.t.fade{display:none}
.t.line.done .vis{stroke-width:4.5}
.t.done{cursor:default}
.t.cty.ok .vis{fill:#e9f5ea} .t.cty.mid .vis{fill:var(--mid)} .t.cty.fail .vis{fill:var(--bad)}
.t.wrong .vis{animation:flash .7s}
.t.hint .vis,.t.ask .vis{animation:pulse .9s infinite}
.t.hint.pt .vis,.t.hint.cty .vis,.t.hint.lake .vis{fill:var(--bad)}
.t.hint.pt .vis{stroke:#fff}
.t.hint.line .vis{stroke:var(--bad);stroke-width:6}
.t.ask.pt .vis{fill:var(--ask);stroke:#fff;stroke-width:3}
.t.ask.line .vis{stroke:var(--ask);stroke-width:6}
.t.ask.lake .vis,.t.ask.cty .vis{fill:var(--ask)}

.tag rect{stroke:rgba(0,0,0,.25);stroke-width:1}
.tag text{font-family:var(--font);font-weight:800;font-size:12px;fill:var(--ink)}
.tag.ok rect{fill:var(--ok)} .tag.mid rect{fill:var(--mid)} .tag.fail rect{fill:var(--bad)} .tag.fail text{fill:#fff}
.tag{pointer-events:none}
.tag .lead{stroke:#fff;stroke-width:1.5;opacity:.9}

.pill{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));
  background:var(--panel);border-radius:99px;padding:6px 14px;display:flex;gap:12px;font-weight:800;font-size:15px;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pill span:first-child{color:var(--muted)}
.menuBtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));
  width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.15);
  font-size:20px;font-weight:900;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:4px 9px;border-radius:6px;transform:translate(-50%,-150%);white-space:nowrap;transition:opacity .3s}

.prompt{background:var(--panel);text-align:center;border-top:1px solid #d7e4ea;
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prompt .q{font-size:20px;font-weight:700;line-height:1.25;text-wrap:balance}
.prompt .q b{font-weight:900}
.prompt .sub{font-size:13px;color:var(--muted);font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choices[hidden],.typer[hidden]{display:none}
.choices button,.typer button,.panel button,.card button{font:inherit;font-weight:800;cursor:pointer;border-radius:10px;border:2px solid #d3dfe5;background:#fff;color:var(--ink);padding:10px 8px;line-height:1.2}
.choices button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.choices button.yes{background:var(--land);border-color:var(--land);color:#fff}
.typer{display:flex;gap:8px;margin-top:10px}
.typer input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:17px;padding:9px 12px;border:2px solid #d3dfe5;border-radius:10px;color:var(--ink);background:#fff}
.typer input:focus{outline:none;border-color:var(--land)}
.typer input.shake{animation:shake .35s;border-color:var(--bad)}
button:focus-visible{outline:3px solid var(--ask);outline-offset:2px}

.overlay{position:absolute;inset:0;background:rgba(20,40,30,.45);display:grid;place-items:center;padding:16px;z-index:5}
.overlay[hidden]{display:none}
.card,.panel{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:100%;overflow:auto}
.card h2{margin:0;font-size:46px;font-weight:900;color:var(--land);font-variant-numeric:tabular-nums}
.card p{margin:2px 0 12px;color:var(--muted);font-weight:700}
.card ul{margin:0 0 14px;padding-left:18px;max-height:150px;overflow:auto;font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow button{flex:1}
button.go{background:var(--land);border-color:var(--land);color:#fff}
.panel h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.panel .grid button[aria-pressed="true"]{border-color:var(--land);background:#e6f3e8}
.panel .modes{grid-template-columns:1fr 1fr 1fr}

@keyframes pulse{50%{opacity:.3}}
@keyframes flash{0%,70%{fill:var(--bad);stroke:var(--bad)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="app">
  <div class="map" id="mapbox">
    <svg id="map" viewBox="25 0 700 735" preserveAspectRatio="xMidYMid meet" aria-label="Karte von Afrika"></svg>
    <button class="menuBtn" id="menuBtn" aria-label="Einstellungen">☰</button>
    <div class="pill"><span id="sTime">0:00</span><span id="sScore">0 %</span></div>
    <div class="zoom"><button id="zIn" aria-label="Hineinzoomen">+</button><button id="zOut" aria-label="Herauszoomen">−</button><button id="zReset" aria-label="Ganze Karte" style="font-size:16px">⤢</button></div>
    <div class="tip" id="tip" style="opacity:0"></div>

    <div class="overlay" id="menu" hidden>
      <div class="panel">
        <h3>Modus</h3>
        <div class="grid modes">
          <button data-mode="click" aria-pressed="true">Zeigen</button>
          <button data-mode="choice" aria-pressed="false">Raten</button>
          <button data-mode="type" aria-pressed="false">Schreiben</button>
        </div>
        <h3>Themen</h3>
        <div class="grid" id="chips"></div>
        <div class="btnrow"><button class="go" id="menuGo">Neu starten</button></div>
      </div>
    </div>

    <div class="overlay" id="done" hidden>
      <div class="card">
        <h2 id="dScore">0 %</h2>
        <p id="dText"></p>
        <ul id="dMiss"></ul>
        <div class="btnrow">
          <button class="go" id="again">Nochmal</button>
          <button id="practice">Fehler üben</button>
        </div>
      </div>
    </div>
  </div>

  <div class="prompt">
    <div class="q" id="ask">…</div>
    <div class="sub" id="sub"></div>
    <div class="choices" id="choices" hidden></div>
    <form class="typer" id="typer" hidden autocomplete="off">
      <input id="answer" type="text" placeholder="Name eintippen …" autocapitalize="off" spellcheck="false">
      <button class="go" type="submit">OK</button>
    </form>
  </div>
</div>

 {id:"a",name:"Tschadsee",cat:"Seen",type:"lake",lbl:[13.8,11.2]},
 {id:"b",name:"Victoriasee",cat:"Seen",type:"lake",alias:["viktoriasee"],lbl:[33,-4]},
 {id:"c",name:"Tanganjikasee",cat:"Seen",type:"lake",alias:["tanganyikasee","tanganjika"],lbl:[26.8,-7]},
 {id:"d",name:"Malawisee",cat:"Seen",type:"lake",alias:["njassasee","nyassasee"],lbl:[38.8,-11.5]},
 {id:"1",name:"Nil",cat:"Flüsse",type:"line",lbl:[28.5,22.5]},
 {id:"2",name:"Niger",cat:"Flüsse",type:"line",lbl:[-2,18.5]},
 {id:"3",name:"Kongo",cat:"Flüsse",type:"line",lbl:[19.5,3.5]},

 {id:"5",name:"Oranje",cat:"Flüsse",type:"line",alias:["orange"],lbl:[21.5,-31]},
];
const LBLFIX={"Mosambik":[37,-16],"Somalia":[45.5,4],"Tansania":[34.5,-6.5],"Malawi":[34.2,-12.5],"Ägypten":[29.5,26.5],"Südafrika":[23,-30.5],"Kenia":[37.8,0.5],"Elfenbeinküste":[-5.5,7.6]};
const C_ALIAS={"Elfenbeinküste":["cote divoire","côte d'ivoire"],"Demokratische Republik Kongo":["dr kongo","kongo kinshasa","drk"],"Republik Kongo":["kongo brazzaville","kongo"],"Eswatini":["swasiland"],"Zentralafrikanische Republik":["zar"]};
GEO.countries.forEach((c,i)=>{const f=LBLFIX[c.n];OBJ.push({id:"L"+i,name:c.n,cat:"Länder",type:"cty",d:c.d,cc:f?P(...f):c.c,small:c.small,alias:C_ALIAS[c.n]})});

const CATS=["Becken","Schwellen","Gebirge","Gräben","Inseln","Seen","Flüsse","Länder"];
const NS="http://www.w3.org/2000/svg";
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const $=id=>document.getElementById(id);
const svg=$("map");

el("path",{class:"other",d:GEO.other},svg);
const gC=el("g",{},svg);
const gT=el("g",{},svg), gTags=el("g",{},svg);

const nodes={};
const rank={cty:0,line:1,lake:2,pt:3};
for(const o of [...OBJ].sort((a,b)=>rank[a.type]-rank[b.type])){
  const g=el("g",{class:"t "+o.type},o.type==="cty"?gC:gT);
  if(o.type==="pt"){const[x,y]=P(...o.at);el("circle",{class:"hit",cx:x,cy:y,r:22},g);el("circle",{class:"vis",cx:x,cy:y,r:8},g);o.lp=[x,y-22];}
  if(o.type==="lake"){const d=GEO.lakes[o.id];el("path",{class:"hit",d},g);const v=el("path",{class:"vis",d},g);o.lp=P(...o.lbl);
    if(o.id==="a"){const bb=v.getBBox(),cx=bb.x+bb.width/2,cy=bb.y+bb.height/2;g.setAttribute("transform",`translate(${cx} ${cy}) scale(4.2) translate(${-cx} ${-cy})`);g.querySelector(".hit").style.strokeWidth="5"}}
  if(o.type==="line"){const d=GEO.rivers[o.id];el("path",{class:"hit",d},g);el("path",{class:"vis",d},g);o.lp=P(...o.lbl);}
  if(o.type==="cty"){el("path",{class:"vis",d:o.d},g);if(o.small)el("circle",{class:"hit",cx:o.cc[0],cy:o.cc[1],r:14},g);o.lp=o.cc;}
  g.addEventListener("click",e=>onClick(o.id,e));
  nodes[o.id]={o,g,tag:null};
}
const byId=Object.fromEntries(OBJ.map(o=>[o.id,o]));

let mode="click",active=new Set(CATS.filter(c=>c!=="Länder")),queue=[],cur=null,tries=0,res={},t0=0,timer=null,locked=false,total=0,ids=[];

const chips=$("chips");
for(const c of CATS){const b=document.createElement("button");b.textContent=c;b.setAttribute("aria-pressed",active.has(c));
  b.onclick=()=>{if(active.has(c)&&active.size===1)return;active.has(c)?active.delete(c):active.add(c);b.setAttribute("aria-pressed",active.has(c))};chips.appendChild(b);}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("menuBtn").onclick=()=>{$("menu").hidden=false};
$("menuGo").onclick=()=>{$("menu").hidden=true;start()};
$("menu").onclick=e=>{if(e.target.id==="menu")$("menu").hidden=true};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(only){
  ids=only||OBJ.filter(o=>active.has(o.cat)).map(o=>o.id);
  queue=shuffle([...ids]);total=queue.length;res={};
  for(const k in nodes){const n=nodes[k];const on=ids.includes(k);
    n.g.setAttribute("class","t "+n.o.type+(on?" live":" off")+(!on&&n.o.type!=="cty"?" fade":""));
    if(n.tag){n.tag.remove();n.tag=null}}
  boxes=[];
  svg.classList.toggle("borders",ids.some(k=>byId[k].cat==="Länder"));
  $("choices").hidden=mode!=="choice";$("typer").hidden=mode!=="type";
  $("done").hidden=true;t0=Date.now();clearInterval(timer);timer=setInterval(tick,500);tick();next();
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("sTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function stats(){const n=Object.keys(res).length;const p=Object.values(res).reduce((s,v)=>s+(v==="ok"?1:v==="mid"?.5:0),0);
  $("sScore").textContent=(n?Math.round(p/n*100):0)+" %";return p}
function next(){
  for(const k in nodes)nodes[k].g.classList.remove("ask","hint");
  tries=0;locked=false;stats();$("choices").innerHTML="";
  if(!queue.length)return finish();
  cur=queue.shift();const o=byId[cur];const n=Object.keys(res).length+1;
  $("sub").textContent=`${n} / ${total} · ${o.cat}`;
  if(mode==="click"){$("ask").innerHTML=`Klicke auf <b>${o.name}</b>`}
  else{$("ask").textContent="Wie heißt das markierte Objekt?";nodes[cur].g.classList.add("ask");
    if(mode==="choice")renderChoices();else{$("answer").value="";$("answer").focus({preventScroll:true})}}
}
let boxes=[];
function ov(a,b){const w=Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0]),h=Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]);return w>0&&h>0?w*h:0}
function tag(id,cls){const n=nodes[id],o=n.o;n.g.classList.remove("ask","hint");n.g.classList.add("done",cls);
  const g=el("g",{class:"tag "+cls},gTags);const ln=el("line",{class:"lead"},g);const r=el("rect",{rx:4},g);
  const t=el("text",{x:0,y:0,"text-anchor":"middle","dominant-baseline":"central"},g);t.textContent=o.name;
  const bb=t.getBBox(),W=bb.width+10,H=bb.height+4;
  const [ax,ay]=o.type==="pt"?P(...o.at):o.lp;const R=W/2+14;
  const offs=o.type==="pt"
    ?[[0,-20],[0,20],[R,0],[-R,0],[R,-18],[-R,-18],[R,18],[-R,18],[0,-40],[0,40],[R,-38],[-R,-38],[R,38],[-R,38],[0,-60],[0,60]]
    :[[0,0],[0,-18],[0,18],[0,-36],[0,36],[W/2+8,0],[-W/2-8,0],[0,-54],[0,54]];
  const dots=ids.filter(k=>k!==id&&byId[k].type==="pt").map(k=>{const[x,y]=P(...byId[k].at);return[x-11,y-11,22,22]});
  if(o.type==="pt")dots.push([ax-10,ay-10,20,20]);
  let best=null,bs=1e9;
  for(const[dx,dy]of offs){const cx=ax+dx,cy=ay+dy,b=[cx-W/2,cy-H/2,W,H];
    let s=boxes.reduce((s,x)=>s+ov(b,[x[0]-3,x[1]-3,x[2]+6,x[3]+6]),0)+dots.reduce((s,x)=>s+ov(b,x),0);
    if(b[0]<30||b[0]+W>720)s+=500;
    if(s<bs){bs=s;best=[cx,cy,b]}if(s===0)break}
  const[cx,cy,b]=best;boxes.push(b);
  t.setAttribute("x",cx);t.setAttribute("y",cy);r.setAttribute("x",b[0]);r.setAttribute("y",b[1]);r.setAttribute("width",W);r.setAttribute("height",H);
  if(o.type==="pt"&&Math.hypot(cx-ax,cy-ay)>24){ln.setAttribute("x1",ax);ln.setAttribute("y1",ay);ln.setAttribute("x2",cx);ln.setAttribute("y2",cy)}else ln.remove();
  n.tag=g;}
function solve(){res[cur]=tries===0?"ok":tries<3?"mid":"fail";tag(cur,res[cur]);next();}
function showTip(text,e){const r=$("mapbox").getBoundingClientRect();const t=$("tip");t.textContent=text;t.style.left=(e.clientX-r.left)+"px";t.style.top=(e.clientY-r.top)+"px";t.style.opacity=1;clearTimeout(showTip.h);showTip.h=setTimeout(()=>t.style.opacity=0,1000)}
function onClick(id,e){
  if(dragged)return;
  if(mode!=="click"||!cur||locked||res[id]||!ids.includes(id))return;
  if(id===cur)return solve();
  tries++;const g=nodes[id].g;g.classList.remove("wrong");void g.getBBox();g.classList.add("wrong");setTimeout(()=>g.classList.remove("wrong"),700);
  showTip(byId[id].name,e);
  if(tries>=3)nodes[cur].g.classList.add("hint");
}
function renderChoices(){
  const o=byId[cur];const pool=OBJ.filter(x=>x.id!==cur);
  const same=shuffle(pool.filter(x=>x.cat===o.cat)),other=shuffle(pool.filter(x=>x.cat!==o.cat&&x.cat!=="Länder"));
  const opts=shuffle([o,...[...same,...other].slice(0,3)]);const box=$("choices");box.innerHTML="";
  for(const x of opts){const b=document.createElement("button");b.type="button";b.textContent=x.name;
    b.onclick=()=>{if(locked||b.classList.contains("no"))return;
      if(x.id===cur){b.classList.add("yes");locked=true;setTimeout(solve,400);return}
      tries++;b.classList.add("no");
      if(tries>=2){locked=true;[...box.children].find(c=>c.textContent===o.name).classList.add("yes");tries=3;setTimeout(solve,1200)}};
    box.appendChild(b);}
}
const norm=s=>s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[^a-z]/g,"");
const norm2=s=>norm(s).replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u");
const matches=(o,v)=>[o.name,...(o.alias||[])].some(x=>norm(x)===norm(v)||norm2(x)===norm2(v));
$("typer").addEventListener("submit",e=>{e.preventDefault();if(mode!=="type"||!cur||locked)return;const inp=$("answer");const v=inp.value.trim();if(!v)return;
  if(matches(byId[cur],v))return solve();
  tries++;inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");
  if(tries>=3){locked=true;inp.value=byId[cur].name;setTimeout(solve,1300)}else inp.select();});
function finish(){clearInterval(timer);const p=stats();const pct=Math.round(p/total*100);cur=null;
  $("dScore").textContent=pct+" %";
  $("dText").textContent=`${Object.values(res).filter(v=>v==="ok").length} von ${total} auf Anhieb richtig · ${$("sTime").textContent}`;
  const miss=Object.keys(res).filter(k=>res[k]!=="ok");
  $("dMiss").innerHTML=miss.map(k=>`<li>${byId[k].name}</li>`).join("")||"<li>Keine Fehler – stark!</li>";
  $("practice").hidden=!miss.length;$("practice").onclick=()=>start(miss);
  $("ask").textContent=pct>=90?"Sehr gut!":pct>=60?"Gut gemacht!":"Weiter üben!";$("sub").textContent="";$("done").hidden=false;}
$("again").onclick=()=>start();
// Zoomen & Verschieben (Pinch, Ziehen, Mausrad, Buttons)
const VB0={x:25,y:0,w:700,h:735};let vb={...VB0},dragged=false;const ptrs=new Map();let last=null;
function setVB(){const minW=110;vb.w=Math.min(Math.max(vb.w,minW),VB0.w*1.2);vb.h=vb.w*VB0.h/VB0.w;
  vb.x=Math.min(Math.max(vb.x,VB0.x-vb.w*.5),VB0.x+VB0.w-vb.w*.5);vb.y=Math.min(Math.max(vb.y,VB0.y-vb.h*.5),VB0.y+VB0.h-vb.h*.5);
  svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function toSvg(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function zoomAt(f,cx,cy){const a=toSvg(cx,cy);vb.w*=f;vb.h*=f;vb.x=a.x-(a.x-vb.x)*f;vb.y=a.y-(a.y-vb.y)*f;setVB()}
function center(){const r=svg.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
$("zIn").onclick=()=>zoomAt(.6,...center());$("zOut").onclick=()=>zoomAt(1/.6,...center());$("zReset").onclick=()=>{vb={...VB0};setVB()};
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY>0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
svg.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1){dragged=false;last={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY}}});
svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){dragged=true;const [p1,p2]=[...ptrs.values()];const q=[...ptrs.entries()].map(([id,p])=>id===e.pointerId?prev:p);
    const d1=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),d2=Math.hypot(p1.x-p2.x,p1.y-p2.y);if(d1>0&&d2>0)zoomAt(d1/d2,(p1.x+p2.x)/2,(p1.y+p2.y)/2);return}
  if(ptrs.size===1&&last){if(Math.hypot(e.clientX-last.sx,e.clientY-last.sy)>8)dragged=true;
    if(dragged){const a=toSvg(last.x,last.y),b=toSvg(e.clientX,e.clientY);vb.x-=b.x-a.x;vb.y-=b.y-a.y;setVB()}last.x=e.clientX;last.y=e.clientY}});
const up=e=>{ptrs.delete(e.pointerId);if(!ptrs.size)last=null;else{const p=[...ptrs.values()][0];last={x:p.x,y:p.y,sx:p.x,sy:p.y}}};
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);svg.addEventListener("pointerleave",up);
start();
</script>
